# keyd-application-mapper: per-window overrides of the keyd config
# (modules/nixos/desktop.nix). Sections are app_id globs (fnmatch; an
# Xwayland window's app_id is its X class), `keyd bind reset` on every
# focus change, so a window not listed here gets the plain config back.

# Steam/Proton games (class steam_app_<appid>): space must be a real
# held key again — jump / fly (Noita) — not $mod. The mapper matches the
# class only after turning every non-alphanumeric run into `-` and
# lowercasing, so the glob must be written against `steam-app-<appid>`.
[steam-app-*]
space = space
